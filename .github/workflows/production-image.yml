# Build the Recipe production nginx image with a sibling PWA-Base checkout
# (same layout as local ~/projects). Push to GHCR on production branch only.
name: production-image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege at workflow level; job grants packages:write for GHCR pushes.
permissions:
  contents: read

env:
  APP_DIR: Recipe-PWA
  PWA_BASE_DIR: PWA-Base
  # Foundation pin — consumer apps track PWA-Base main for the Docker helper.
  PWA_BASE_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Recipe-PWA
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIR }}

      - name: Checkout PWA-Base (sibling)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PWA-Base
          ref: ${{ env.PWA_BASE_REF }}
          path: ${{ env.PWA_BASE_DIR }}

      - name: Image name (lowercase for GHCR)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/recipe-pwa" >> "$GITHUB_OUTPUT"

      - name: Sibling-context .dockerignore
        run: |
          sed \
            -e "s/__APP_DIR__/${APP_DIR}/g" \
            -e "s/__PWA_BASE_DIR__/${PWA_BASE_DIR}/g" \
            "${PWA_BASE_DIR}/docker/sibling-context.dockerignore" > .dockerignore
          cat .dockerignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') && github.event_name != 'pull_request' }}
            type=sha,prefix=sha-,format=long
            type=ref,event=branch,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.PWA_BASE_DIR }}/docker/consumer-spa.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_DIR=${{ env.APP_DIR }}
            PWA_BASE_DIR=${{ env.PWA_BASE_DIR }}
            PLATFORM_RUNTIME_MODE=production
            NGINX_CONF=${{ env.PWA_BASE_DIR }}/docker/nginx-spa.conf
            APP_BUILD_CMD=npm run build
          cache-from: type=gha
          cache-to: type=gha,mode=max
